[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-kokoro-tts"
version = "0.6.0"
description = "Local speech synthesis and timed audio lessons with Kokoro"
requires-python = ">=3.10,<3.14"
dependencies = [
    "kokoro==0.9.4",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.scripts]
tts = "local_kokoro_tts.cli:main"
tts-episode = "local_kokoro_tts.episode:main"
tts-qa-pauses = "local_kokoro_tts.qa:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["local_kokoro_tts"]
